<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiver Cable · Cobro en campo</title>
<style>
  :root { --azul:#0b4a8b; --verde:#1b7f3b; --rojo:#b3261e; --gris:#f3f5f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, Segoe UI, Roboto, sans-serif; background:var(--gris); color:#1c2430; }
  header { background:var(--azul); color:#fff; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { display:block; font-size:13px; margin:10px 0 4px; color:#4a5566; }
  input, select { width:100%; padding:10px; font-size:15px; border:1px solid #c9d1dc; border-radius:6px; }
  button { margin-top:12px; width:100%; padding:11px; font-size:15px; border:0; border-radius:6px; background:var(--azul); color:#fff; cursor:pointer; }
  button.cobrar { background:var(--verde); width:auto; padding:8px 14px; margin:0; }
  .msg { padding:10px; border-radius:6px; margin-top:10px; font-size:14px; }
  .ok { background:#e5f4ea; color:var(--verde); } .err { background:#fbe9e7; color:var(--rojo); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 4px; border-bottom:1px solid #e3e7ee; }
  .oculto { display:none; }
</style>
</head>
<body>
<header><h1>Fiver Cable · Cobro digital en campo</h1><span id="usuario"></span></header>
<main>
  <section class="card" id="seccion-login">
    <h2>Ingreso del técnico</h2>
    <label for="correo">Correo</label><input id="correo" type="email" autocomplete="username">
    <label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password">
    <button id="btn-login">Ingresar</button>
    <div id="login-msg"></div>
  </section>

  <section class="card oculto" id="seccion-cobro">
    <h2>Buscar facturas pendientes</h2>
    <label for="id-cliente">Código de cliente</label><input id="id-cliente" type="number" min="1">
    <label for="metodo">Método de pago</label>
    <select id="metodo">
      <option value="Efectivo">Efectivo</option>
      <option value="Tarjeta">Tarjeta (POS)</option>
      <option value="Transferencia">Transferencia</option>
    </select>
    <label for="autorizacion">Código de autorización (tarjeta / transferencia)</label><input id="autorizacion" type="text">
    <button id="btn-buscar">Buscar</button>
    <div id="cobro-msg"></div>
    <table id="tabla-facturas" class="oculto">
      <thead><tr><th>Factura</th><th>Serie-Número</th><th>Total</th><th>Estado</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>
<script>
const AUTH_URL = "__AUTH_URL__";
let token = null;
const $ = (id) => document.getElementById(id);
function mensaje(id, texto, ok) { $(id).innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${texto}</div>`; }
function escapar(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

$("btn-login").onclick = async () => {
  try {
    const r = await fetch(`${AUTH_URL}/api/auth/login`, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ correo:$("correo").value, password:$("password").value }) });
    const d = await r.json();
    if (!r.ok) return mensaje("login-msg", escapar(d.detail || "Error de ingreso"), false);
    if (d.rol === "Suscriptor") return mensaje("login-msg", "Solo personal técnico puede cobrar en campo", false);
    token = d.access_token;
    $("usuario").textContent = $("correo").value;
    $("seccion-login").classList.add("oculto");
    $("seccion-cobro").classList.remove("oculto");
  } catch (e) { mensaje("login-msg", "No se pudo conectar con el servicio de autenticación", false); }
};

async function buscar() {
  const id = $("id-cliente").value;
  const r = await fetch(`/api/facturas?id_cliente=${encodeURIComponent(id)}&estado=Pendiente`,
                        { headers:{ Authorization:`Bearer ${token}` } });
  const d = await r.json();
  const tbody = document.querySelector("#tabla-facturas tbody");
  tbody.innerHTML = "";
  if (!r.ok) return mensaje("cobro-msg", escapar(d.detail || "Error"), false);
  if (d.length === 0) { $("tabla-facturas").classList.add("oculto"); return mensaje("cobro-msg", "El cliente no tiene facturas pendientes", true); }
  $("cobro-msg").innerHTML = "";
  $("tabla-facturas").classList.remove("oculto");
  for (const f of d) {
    const tr = document.createElement("tr");
    tr.id = `factura-${f.id_factura}`;
    tr.innerHTML = `<td>${f.id_factura}</td><td>${escapar(f.serie_fel)}-${escapar(f.numero_fel)}</td>
      <td>Q${Number(f.monto_total).toFixed(2)}</td><td class="estado">${escapar(f.estado_pago)}</td>
      <td><button class="cobrar" data-id="${f.id_factura}" data-monto="${f.monto_total}">Cobrar</button></td>`;
    tbody.appendChild(tr);
  }
  document.querySelectorAll("button.cobrar").forEach(b => b.onclick = () => cobrar(b.dataset.id, b.dataset.monto));
}
$("btn-buscar").onclick = buscar;

async function cobrar(idFactura, monto) {
  const body = { id_factura:Number(idFactura), monto_pagado:Number(monto), metodo_pago:$("metodo").value,
                 codigo_autorizacion:$("autorizacion").value || null };
  const r = await fetch("/api/pagos", { method:"POST", headers:{ "Content-Type":"application/json", Authorization:`Bearer ${token}` },
                                        body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return mensaje("cobro-msg", escapar(d.detail || "Error al cobrar"), false);
  const fila = $(`factura-${idFactura}`);
  fila.querySelector(".estado").textContent = d.estado_factura;
  fila.querySelector("button").remove();
  mensaje("cobro-msg", `Pago registrado. Transacción <b id="id-transaccion">${escapar(d.id_transaccion_pasarela)}</b>. Factura ${idFactura}: ${escapar(d.estado_factura)}`, true);
}
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiver Cable · Cobro en campo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
:root{--navy:#112c54;--blue:#1264dd;--cyan:#20b7cf;--bg:#f3f6fa;--muted:#718096;--line:#e6ebf2;--green:#087f65;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(130deg,#7129df,#8b43ed 55%,#6221d1);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172b49}
button,input,select{font:inherit}button{cursor:pointer}
.app{width:min(1200px,100%);min-height:calc(100vh - 48px);margin:0 auto;background:var(--bg);border:1px solid #dce4ed;border-radius:8px;box-shadow:0 18px 55px #19375918;display:flex;flex-direction:column;overflow:hidden}
.oculto{display:none!important}
/* ingreso */
body.login-activo{display:grid;min-height:100svh;place-items:center;padding:32px;background:radial-gradient(ellipse at 12% 22%,#b77af4 0%,transparent 36%),linear-gradient(115deg,#7829e7 0%,#8d39f0 52%,#7023dd 100%);overflow-x:hidden}
body.login-activo .app{width:100%;min-height:0;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.login{width:min(1000px,calc(100vw - 64px));height:min(700px,calc(100svh - 64px));min-height:560px;flex:none;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;overflow:hidden;border-radius:30px;background:#fff;box-shadow:0 24px 70px #35106458;color:var(--navy)}
.login-brand{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:28px;background:#f5f0ff}
.login-brand:before{content:"";position:absolute;inset:-17% -14% 37% -17%;background:linear-gradient(145deg,#d3b4ff 0%,#a367f2 52%,#782ce5 100%);border-radius:0 0 51% 19% / 0 0 25% 12%;transform:rotate(-3deg)}
.login-brand:after{content:"";position:absolute;width:54%;height:24%;right:-16%;bottom:-9%;border-radius:50% 0 0 0;background:#e9ddff;transform:rotate(-16deg)}
.support-visual{position:relative;z-index:1;width:min(100%,430px);display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,24px);animation:art-float 5s ease-in-out infinite}
.support-illustration{display:block;width:min(62%,260px);height:auto;max-height:100%;overflow:visible}
.support-icons{width:min(35%,136px);display:grid;grid-template-columns:repeat(2,minmax(42px,1fr));gap:12px;align-content:center}
.support-icon{aspect-ratio:1;display:grid;place-items:center;border:1px solid #fff;border-radius:50%;background:#fff;color:#7024d2;font-size:23px;box-shadow:0 9px 22px #50228b20}
.support-icon:nth-child(2){background:#e5f8f2;color:#087f65}
.support-icon:nth-child(3){background:#fff4d9;color:#aa7011}
.support-icon:nth-child(4){background:#e9e0ff;color:#5720ac}
.support-icon i{line-height:1}
.avatar-cluster{height:66px;display:flex;align-items:center;justify-content:center;margin:0 auto 9px}
.avatar{width:49px;height:49px;display:grid;place-items:center;overflow:hidden;border:3px solid #fff;border-radius:50%;background:#6222c5;box-shadow:0 4px 12px #33215230}
.avatar+.avatar{margin-left:-12px;transform:translateY(-7px)}
.avatar i{color:#fff;font-size:19px}
.login-content{width:100%;max-width:500px;margin:0 auto;padding:34px 56px;display:flex;flex-direction:column;justify-content:center}
.login-content h1{margin:0 0 24px;color:#55505f;font-size:28px;font-weight:600;line-height:1.2;text-align:center}
.login-content>p{margin:0 0 22px;color:var(--muted)}
.login-content .eyebrow{display:none}
.login-content form{display:flex;flex-direction:column;align-items:stretch}
.input-wrap{position:relative;display:flex;align-items:center;height:52px;border-bottom:1px solid #8d8b93;transition:border-color .18s,border-width .18s}
.input-wrap:focus-within{border-bottom:2px solid #7022d1}
.input-wrap>svg{flex:none;width:18px;height:18px;margin:0 12px 0 1px;color:#8525df;pointer-events:none}
.input-wrap.password-wrap>svg{color:#92969d}
.input-wrap .input{height:100%;padding:8px 4px;border:0;border-radius:0;background:transparent;box-shadow:none;font-size:15px}
.input-wrap .input::placeholder{color:#9b9ba2}
.login-content .field{margin:21px 0 4px;color:#77727e;font-size:13px;font-weight:600}
.account-help{align-self:flex-end;margin-top:9px;padding:5px 0;border:0;background:transparent;color:#655b71;font-size:12px;text-align:right;text-decoration:underline;text-underline-offset:2px}
.payment-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
.payment-heading h2{margin:5px 0 15px}
.password-toggle{flex:none;margin-bottom:10px;padding:7px 9px;font-size:11px}
.change-password-panel{max-width:760px}
.btn-login{display:block;width:min(220px,100%);min-height:46px;align-self:center;margin-top:18px;border:0;border-radius:999px;background:#7021d4;color:#fff;font-size:15px;font-weight:700;box-shadow:0 5px 12px #7021d42c;transition:background .18s,transform .18s}
.btn-login:hover{background:#5e18bd;transform:translateY(-1px)}
.btn-login:disabled{cursor:wait;opacity:.72;transform:none}
.login-note{margin:16px 0 0;color:#99949e;font-size:10px;text-align:center}
@keyframes art-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.eyebrow{font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:800;color:var(--muted)}
.field{display:block;font-size:12px;font-weight:800;margin:15px 0 7px}
.input{display:block;width:100%;border:1px solid #d7e0eb;border-radius:12px;background:#fff;padding:12px 13px;color:#172b49;outline:none}
.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1264dd1c}
.btn{border:0;border-radius:13px;padding:13px 16px;background:var(--blue);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.full{width:100%;margin-top:18px}
.btn.cobrar{padding:9px 14px;background:var(--green)}
/* cobro */
.header{height:63px;flex:none;background:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.header-left{display:flex;align-items:center;gap:10px}
.header-right{display:flex;align-items:center;gap:16px}
.btn-logout{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px;color:var(--navy);font-weight:700}
.btn-logout:hover{background:#f3f6fa}
.mark{font-weight:900;color:var(--blue);letter-spacing:-1px;font-size:20px}
.usuario{font-size:12px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.view{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:32px 40px 44px}
.view h2{margin:5px 0 15px}
.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:13px;box-shadow:0 5px 20px #112c5408}
.view>.card,.view>.notice,.view>#cobro-msg{max-width:760px}
#lista-facturas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{display:inline-flex;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;background:#fff3df;color:#ae6a05}
.pill.ok{background:#e9f6f2;color:var(--green)}
.monto{font-size:20px;font-weight:850;letter-spacing:-.5px}
.muted{color:var(--muted)}.small{font-size:12px}
.notice{background:#eaf5ff;color:#245681;border-radius:12px;padding:12px;font-size:12px;margin:12px 0}
.msg{padding:12px;border-radius:12px;margin-top:12px;font-size:13px}
.msg.ok{background:#e4f7f1;color:var(--green)}
.msg.err{background:#fdecea;color:var(--red)}
.msg.info{background:#eaf5ff;color:#245681}
.section{margin:22px 2px 11px;font-weight:800;font-size:16px}
@media(max-width:800px){
  body{padding:0;background:var(--bg)}
  .app{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}
  .view{padding:24px 24px 36px}
}
@media(max-width:520px){
  .header{padding:12px 16px}
  .header-right{gap:8px}
  .usuario{max-width:110px}
  .btn-logout{padding:7px 9px;font-size:12px}
  .view{padding:20px 16px 30px}
  #lista-facturas{grid-template-columns:1fr}
}
@media(max-width:620px){
  body.login-activo{min-height:100svh;padding:16px;overflow-y:auto}
  body.login-activo .app{min-height:calc(100svh - 32px)}
  body.login-activo .login{width:100%;height:auto;min-height:0;grid-template-columns:1fr;grid-template-rows:210px auto;border-radius:24px}
  .login-brand{padding:10px;background:#f7f3ff}
  .login-brand:before{inset:-44% -12% 50% -18%;border-radius:0 0 48% 22% / 0 0 28% 12%}
  .login-brand:after{display:none}
  .support-visual{width:min(100%,310px);gap:8px}
  .support-illustration{width:40%;max-height:100%}
  .support-icons{width:34%;grid-template-columns:repeat(2,minmax(36px,1fr));gap:8px}
  .support-icon{font-size:18px}
  .login-content{max-width:440px;padding:28px clamp(22px,8vw,40px) 34px}
  .avatar-cluster{height:55px;margin-bottom:7px}
  .avatar{width:43px;height:43px}
}
@media(max-width:380px){
  body.login-activo .login{grid-template-rows:185px auto}
  .support-visual{width:100%}
  .support-illustration{width:40%}
  .support-icons{grid-template-columns:repeat(2,minmax(32px,1fr));gap:6px}
  .support-icon{font-size:16px}
  .login-content{padding:22px 20px 28px}
}
@media(max-height:620px) and (min-width:621px){
  body.login-activo{padding:16px}
  .login{height:calc(100svh - 32px);min-height:300px}
  .login-content{padding:10px 24px}
  .avatar-cluster{height:35px;margin-bottom:0}
  .avatar{width:32px;height:32px;border-width:2px}
  .login-content h1{margin-bottom:8px;font-size:19px}
  .input-wrap{height:36px}
  .input-wrap>svg{width:15px;height:15px;margin-right:8px}
  .login-content .field{margin-top:8px}
  .account-help{margin-top:4px}
  .btn-login{min-height:34px;margin-top:10px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

<div class="app">

          </g>

          <rect x="97" y="207" width="99" height="19" rx="9.5" fill="#7024d2"/>
          <text x="146" y="220" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="7" font-weight="700">Continuar</text>
          <circle cx="146" cy="278" r="2" fill="#9a98a3"/><circle cx="158" cy="278" r="2" fill="#9a98a3"/><circle cx="170" cy="278" r="2" fill="#9a98a3"/>

      </svg>
      <div class="support-icons">
        <span class="support-icon"><i class="fa-solid fa-headset"></i></span>
        <span class="support-icon"><i class="fa-solid fa-wifi"></i></span>
        <span class="support-icon"><i class="fa-solid fa-screwdriver-wrench"></i></span>
        <span class="support-icon"><i class="fa-solid fa-shield-halved"></i></span>
      </div>
      </div>
    </div>
    <div class="login-content">
      <div class="avatar-cluster" aria-hidden="true">
        <span class="avatar"><i class="fa-solid fa-user-gear"></i></span>
        <span class="avatar"><i class="fa-solid fa-user-check"></i></span>
      </div>
      <h1>Inicio de Sesión</h1>
      <form id="login-form">
        <label class="field" for="correo">Correo electrónico</label>
        <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input id="correo" class="input" type="email" autocomplete="username" placeholder="Correo electrónico" required></div>
        <label class="field" for="password">Contraseña</label>

        <button id="btn-recuperar-password" class="account-help" type="button">¿Olvidaste tu contraseña?</button>

      </form>
    </div>
  </section>

  <section id="seccion-cobro" class="oculto" style="display:flex;flex-direction:column;flex:1">
    <div class="header">
      <div class="header-left"><span class="mark">f.</span><strong>Cobro en campo</strong></div>
      <div class="header-right">
        <span class="usuario" id="usuario"></span>
        <button id="btn-logout" class="btn-logout" type="button">Cerrar sesión</button>
      </div>
    </div>
    <div class="view">
      <div class="eyebrow">Cobro digital</div>
      <div class="payment-heading">
        <h2>Registrar pago</h2>
        <button id="btn-toggle-password" class="btn-logout password-toggle" type="button" aria-expanded="false">Cambiar contraseña</button>
      </div>
      <form id="change-password-form" class="card change-password-panel oculto">
        <div class="eyebrow">SEGURIDAD DE LA CUENTA</div>
        <label class="field" for="password-actual">Contraseña actual</label>
        <input id="password-actual" class="input" type="password" autocomplete="current-password" required>
        <label class="field" for="password-nueva">Nueva contraseña</label>
        <input id="password-nueva" class="input" type="password" autocomplete="new-password" minlength="8" required>
        <label class="field" for="password-confirmacion">Confirmar nueva contraseña</label>
        <input id="password-confirmacion" class="input" type="password" autocomplete="new-password" minlength="8" required>
        <button id="btn-guardar-password" class="btn full" type="submit">Actualizar contraseña</button>
        <div id="password-msg" aria-live="polite"></div>
      </form>

        <label class="field" for="id-cliente" style="margin-top:0">Código de cliente</label>
        <input id="id-cliente" class="input" type="number" min="1" placeholder="Ejemplo: 1">
        <label class="field" for="metodo">Método de pago</label>
        <select id="metodo" class="input">
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Transferencia">Transferencia</option>
        </select>
        <label class="field" for="autorizacion">Código de autorización</label>
        <input id="autorizacion" class="input" type="text" placeholder="Solo para tarjeta o transferencia">

      </div>
      <div class="notice">El cobro liquida la factura completa. El sistema genera el número de transacción del recibo.</div>
      <div id="cobro-msg"></div>
      <div id="tabla-facturas" class="oculto">
        <div class="section">Facturas del cliente</div>
        <div id="lista-facturas"></div>
      </div>
    </div>
  </section>

</div>
<script>
const AUTH_URL = "__AUTH_URL__";
let token = null;
const $ = (id) => document.getElementById(id);
const escapar = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mensaje(id, texto, ok) { $(id).innerHTML = `<div class="msg ${ok ? "ok" : "err"}">${texto}</div>`; }
function mensajeInfo(id, texto) { $(id).innerHTML = `<div class="msg info">${escapar(texto)}</div>`; }

$("login-form").onsubmit = async (event) => {
  event.preventDefault();
  const botonLogin = $("btn-login");
  botonLogin.disabled = true;
  botonLogin.textContent = "Ingresando...";
  try {
    if (location.protocol === "file:") {
      return mensaje("login-msg", "Para iniciar sesión, levanta Docker y abre el portal en http://localhost:3003/portal; la vista como archivo solo permite revisar el diseño.", false);
    }
    const r = await fetch(`${AUTH_URL}/api/auth/login`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correo: $("correo").value, password: $("password").value }) });
    const d = await r.json();
    if (!r.ok) return mensaje("login-msg", escapar(d.detail || "No se pudo ingresar"), false);
    if (d.rol === "Suscriptor") return mensaje("login-msg", "Solo personal técnico puede cobrar en campo", false);
    token = d.access_token;
    $("usuario").textContent = $("correo").value;
    document.body.classList.remove("login-activo");
    $("seccion-login").classList.add("oculto");
    $("seccion-cobro").classList.remove("oculto");
  } catch (e) { mensaje("login-msg", "No se pudo conectar con autenticación. Verifica que el portal y ms_auth estén activos.", false); }
  finally { botonLogin.disabled = false; botonLogin.textContent = "Iniciar sesión"; }
};

$("btn-recuperar-password").onclick = () => {
  mensajeInfo("login-msg", "Para restablecer tu contraseña, solicita ayuda a Administración. La recuperación automática por correo aún no está configurada.");
};

$("btn-toggle-password").onclick = () => {
  const panel = $("change-password-form");
  panel.classList.toggle("oculto");
  const visible = !panel.classList.contains("oculto");
  $("btn-toggle-password").setAttribute("aria-expanded", String(visible));
  if (visible) $("password-actual").focus();
};

$("change-password-form").onsubmit = async (event) => {
  event.preventDefault();
  const nueva = $("password-nueva").value;
  const confirmar = $("password-confirmacion").value;
  if (nueva !== confirmar) {
    return mensaje("password-msg", "La confirmación no coincide con la contraseña nueva.", false);
  }

  const botonGuardar = $("btn-guardar-password");
  botonGuardar.disabled = true;
  botonGuardar.textContent = "Actualizando...";
  try {
    const respuesta = await fetch(`${AUTH_URL}/api/auth/cambiar-password`, {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${token}`,
      },
      body: JSON.stringify({
        password_actual: $("password-actual").value,
        password_nueva: nueva,
      }),
    });
    const datos = await respuesta.json();
    if (!respuesta.ok) {
      return mensaje("password-msg", escapar(datos.detail || "No se pudo actualizar la contraseña"), false);
    }
    $("change-password-form").reset();
    mensaje("password-msg", "Contraseña actualizada correctamente.", true);
  } catch (e) {
    mensaje("password-msg", "No se pudo conectar con autenticación. Verifica que ms_auth esté activo.", false);
  } finally {
    botonGuardar.disabled = false;
    botonGuardar.textContent = "Actualizar contraseña";
  }
};

$("btn-logout").onclick = () => {
  token = null;
  $("correo").value = "";
  $("password").value = "";
  $("usuario").textContent = "";
  $("login-msg").replaceChildren();
  $("change-password-form").reset();
  $("change-password-form").classList.add("oculto");
  $("btn-toggle-password").setAttribute("aria-expanded", "false");
  $("password-msg").replaceChildren();
  $("cobro-msg").replaceChildren();
  $("lista-facturas").replaceChildren();
  $("tabla-facturas").classList.add("oculto");
  $("seccion-cobro").classList.add("oculto");
  $("seccion-login").classList.remove("oculto");
  document.body.classList.add("login-activo");
  $("correo").focus();
};

async function buscar() {
  const id = $("id-cliente").value;
  const r = await fetch(`/api/facturas?id_cliente=${encodeURIComponent(id)}&estado=Pendiente`, { headers: { Authorization: `Bearer ${token}` } });
  const d = await r.json();
  const lista = $("lista-facturas");
  lista.innerHTML = "";
  if (!r.ok) return mensaje("cobro-msg", escapar(d.detail || "Error al consultar"), false);
  if (d.length === 0) { $("tabla-facturas").classList.add("oculto"); return mensaje("cobro-msg", "El cliente no tiene facturas pendientes", true); }
  $("cobro-msg").innerHTML = "";
  $("tabla-facturas").classList.remove("oculto");
  for (const f of d) {
    const c = document.createElement("div");
    c.className = "card"; c.id = `factura-${f.id_factura}`;
    c.innerHTML = `<div class="row"><div><div class="eyebrow">Factura ${escapar(f.serie_fel)}-${escapar(f.numero_fel)}</div>
      <div class="monto">Q ${Number(f.monto_total).toFixed(2)}</div></div><span class="pill estado">${escapar(f.estado_pago)}</span></div>
      <button class="btn full cobrar" data-id="${f.id_factura}" data-monto="${f.monto_total}">Cobrar Q ${Number(f.monto_total).toFixed(2)}</button>`;
    lista.appendChild(c);
  }
  document.querySelectorAll("button.cobrar").forEach(b => b.onclick = () => cobrar(b.dataset.id, b.dataset.monto));
}
$("btn-buscar").onclick = buscar;

async function cobrar(idFactura, monto) {
  const body = { id_factura: Number(idFactura), monto_pagado: Number(monto), metodo_pago: $("metodo").value, codigo_autorizacion: $("autorizacion").value || null };
  const r = await fetch("/api/pagos", { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) return mensaje("cobro-msg", escapar(d.detail || "No se pudo registrar el cobro"), false);
  const tarjeta = $(`factura-${idFactura}`);
  const estado = tarjeta.querySelector(".estado");
  estado.textContent = d.estado_factura; estado.classList.add("ok");
  tarjeta.querySelector("button").remove();
  mensaje("cobro-msg", `Cobro registrado. Recibo <b id="id-transaccion">${escapar(d.id_transaccion_pasarela)}</b>`, true);
}
</script>

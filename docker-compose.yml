services:
  auth-service:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: fiver-auth
    environment:
      SERVER_PORT: 8081
    ports:
      - "${AUTH_PORT:-8081}:8081"

  red-service:
    build:
      context: .
      dockerfile: docker/red/Dockerfile
    container_name: fiver-red
    environment:
      SERVER_PORT: 8082
    ports:
      - "${RED_PORT:-8082}:8082"

  soporte-service:
    build:
      context: .
      dockerfile: docker/soporte/Dockerfile
    container_name: fiver-soporte
    environment:
      SERVER_PORT: 8083
    ports:
      - "${SOPORTE_PORT:-8083}:8083"

  pagos-service:
    build:
      context: .
      dockerfile: docker/pagos/Dockerfile
    container_name: fiver-pagos
    environment:
      SERVER_PORT: 8084
    ports:
      - "${PAGOS_PORT:-8084}:8084"


# Fiver Cable - entorno local y staging (DevOps 2)
# Un motor PostgreSQL con un esquema por microservicio (database-per-service, Entregable 8)
services:
  postgres_db:
    image: postgres:16-alpine
    container_name: fiver_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
      POSTGRES_DB: ${DB_NAME:-fivercable_db}
      TZ: America/Guatemala
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fivercable_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis_cache:
    image: redis:7-alpine
    container_name: fiver_redis
    ports:
      - "6379:6379"

  ms_auth:
    build: { context: ., dockerfile: docker/Dockerfile.auth }
    container_name: ms_auth
    env_file: [.env.example]
    environment: { DB_HOST: postgres_db }
    ports: ["3000:3000"]
    depends_on: { postgres_db: { condition: service_healthy } }

  ms_catalogo:
    build: { context: ., dockerfile: docker/Dockerfile.catalogo }
    container_name: ms_catalogo
    env_file: [.env.example]
    environment: { DB_HOST: postgres_db }
    ports: ["3001:3001"]
    depends_on: { postgres_db: { condition: service_healthy } }

  ms_pedidos:
    build: { context: ., dockerfile: docker/Dockerfile.pedidos }
    container_name: ms_pedidos
    env_file: [.env.example]
    environment: { DB_HOST: postgres_db }
    ports: ["3002:3002"]
    depends_on: { postgres_db: { condition: service_healthy } }

  ms_pagos:
    build: { context: ., dockerfile: docker/Dockerfile.pagos }
    container_name: ms_pagos
    env_file: [.env.example]
    environment: { DB_HOST: postgres_db, AUTH_PUBLIC_URL: "http://localhost:3000" }
    ports: ["3003:3003"]
    depends_on: { postgres_db: { condition: service_healthy } }

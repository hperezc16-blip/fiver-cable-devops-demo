      function initCanvas() {
        let c = $("signature"),
          ctx = c.getContext("2d");
        c.width = c.clientWidth * devicePixelRatio;
        c.height = c.clientHeight * devicePixelRatio;
        ctx.scale(devicePixelRatio, devicePixelRatio);
        ctx.strokeStyle = "#173b75";
        ctx.lineWidth = 2.3;
        ctx.lineCap = "round";
        let drawing = false;
        function pos(e) {
          let b = c.getBoundingClientRect();
          return { x: e.clientX - b.left, y: e.clientY - b.top };
        }
        c.onpointerdown = (e) => {
          drawing = true;
          c.setPointerCapture(e.pointerId);
          let p = pos(e);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x + 0.1, p.y + 0.1);
          ctx.stroke();
          S.signed = true;
          S.signedByVisit[S.visit] = true;
        };
        c.onpointermove = (e) => {
          if (!drawing) return;
          let p = pos(e);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
        };
        c.onpointerup = c.onpointercancel = () => (drawing = false);

          const puedeCambiarEstado = ["admin", "jefatura"].includes(S.role) && u.type === "Cliente";
          const estadoActual = u.status === "Baja" ? "Inactivo" : u.status;
          return `<div class="card hero"><div class="metric" style="font-size:23px">${esc(u.name)}</div><div class="row"><small>${esc(u.type)}</small>${pill(u.status)}</div></div><div class="card"><div class="eyebrow">CONTACTO</div><b>${esc(u.contact || "Pendiente de registrar")}</b><div class="divider"></div><div class="eyebrow">${u.type === "Cliente" ? "DIRECCIÓN DEL SERVICIO" : "DIRECCIÓN O ZONA"}</div><b>${esc(u.address)}</b><div class="divider"></div><div class="eyebrow">${u.type === "Cliente" ? "PLAN CONTRATADO" : "ROL ASIGNADO"}</div><b>${esc(u.plan)}</b></div>${puedeCambiarEstado ? `<div class="section">Estado de servicio · demo</div><div class="card"><label class="field" for="demoUserState">Cambiar estado</label><select id="demoUserState" class="input">${["Activo", "Moroso", "Suspendido", "Inactivo"].map((estado) => `<option ${estadoActual === estado ? "selected" : ""}>${estado}</option>`).join("")}</select><div class="notice">La API real requiere un JWT de Administrador o Técnico. Este selector modifica solo los datos de muestra.</div><button class="btn full" type="button" onclick="updateDemoUserState()">Aplicar estado (demo)</button></div>` : ""}`;
        },
        usuarioNuevo: () =>
          `<div class="eyebrow">REEMPLAZO DE FICHA EN PAPEL</div><h2>Nuevo usuario</h2><form onsubmit="saveUser(event)"><label class="field">Nombre completo *</label><input id="newName" class="input" required maxlength="70"><label class="field">Tipo de usuario</label><select id="newType" class="input"><option>Cliente</option><option>Técnico</option><option>Jefatura</option><option>Secretaría</option><option>Administrador</option></select><label class="field">Teléfono</label><input id="newContact" class="input" type="tel" placeholder="+502 5550 0000"><label class="field">Dirección del servicio / zona *</label><input id="newAddress" class="input" required><label class="field">Plan contratado / rol *</label><input id="newPlan" class="input" required placeholder="Internet 100 Mbps + TV / Técnico de campo"><div class="gap"></div><button class="btn full">Guardar registro</button></form>`,
        usuarioOk: () =>
          `<div class="success"><div class="circle">✓</div><h2>Registro guardado</h2><p>${esc(S.users[S.userIndex].name)} quedó registrado en la lista de usuarios.</p><button class="btn full" onclick="go('usuarios')">Ver usuarios</button></div>`,
        inventario: () =>
          `<div class="eyebrow">CONTROL DE BODEGA</div><h2>Inventario</h2><p class="muted small">Toca una categoría para revisar los equipos.</p>${categories
            .map(
              (cat) =>
                `<div class="card"><div class="row"><b>${esc(cat)}</b><span class="pill ${stock(cat) <= 1 ? "warn" : ""}">${stock(cat)} disponible${stock(cat) === 1 ? "" : "s"}</span></div>${stock(cat) <= 1 ? '<div class="small" style="color:#b45b35;margin-top:5px">⚠ Stock bajo · reabastecer</div>' : ""}<div class="divider"></div>${S.equipment
                  .map((x, i) => ({ x, i }))
                  .filter(({ x }) => x.category === cat)
                  .map(
                    ({ x, i }) =>
                      `<div class="row" style="padding:7px 0;cursor:pointer" onclick="S.equipmentIndex=${i};go('equipoDetalle')"><span class="small">${esc(x.serial)}</span>${pill(x.status)} <span>›</span></div>`,
                  )
                  .join("")}</div>`,
            )
            .join(
              "",
            )}<button class="btn secondary full" onclick="go('equipoNuevo')">+ Registrar equipo en bodega</button>`,
        equipoNuevo: () =>
          `<div class="eyebrow">ALTA DE INVENTARIO</div><h2>Registrar equipo</h2><form onsubmit="registerEquipment(event)"><label class="field">Categoría</label><select id="equipmentCategory" class="input">${categories.map((c) => `<option>${esc(c)}</option>`).join("")}</select><label class="field">Número de serie</label><input id="equipmentSerial" class="input" maxlength="50" required placeholder="FIV-MOD-003"><div class="gap"></div><button class="btn full">Guardar equipo</button></form>`,
        equipoDetalle: () => {
          let x = S.equipment[S.equipmentIndex];
          return `<div class="card hero"><div class="eyebrow">${esc(x.category)}</div><div class="metric" style="font-size:20px">${esc(x.serial)}</div>${pill(x.status)}</div><div class="card"><div class="eyebrow">NÚMERO DE SERIE</div><b>${esc(x.serial)}</b><div class="divider"></div><div class="eyebrow">ESTADO</div><b>${esc(x.status)}</b><div class="divider"></div><div class="eyebrow">ASIGNADO A</div><b>${esc(x.assigned || "Sin asignar · en bodega")}</b></div>${x.status === "Disponible" ? '<button class="btn full" onclick="go(\'asignarEquipo\')">Asignar equipo →</button>' : ""}`;
        },
        asignarEquipo: () => {
          let x = S.equipment[S.equipmentIndex];
          return `<div class="eyebrow">SALIDA DE BODEGA</div><h2>Asignar equipo</h2><div class="card"><b>${esc(x.category)} · ${esc(x.serial)}</b><div class="small muted">Estado actual: ${esc(x.status)}</div></div><form onsubmit="assignEquipment(event)"><label class="field">Asignar a cliente o técnico</label><select class="input" id="assignTarget">${S.users
            .filter((u) => ["Cliente", "Técnico"].includes(u.type))
            .map(
              (u) =>
                `<option value="${esc(u.name)}">${esc(u.name)} · ${esc(u.type)}</option>`,
            )
            .join(
              "",
            )}</select><div class="gap"></div><button class="btn full">Confirmar asignación</button></form>`;
        },
        ticketsAdmin: () =>
          `<div class="eyebrow">SOPORTE CENTRALIZADO</div><h2>Tickets</h2><div class="notice">${S.tickets.filter((t) => t.status === "Abierto").length} pendientes de asignar · ${S.tickets.length} en total</div><label class="field">Filtrar por estado</label><select id="ticketFilter" class="input" onchange="listTickets()">${["Todos", "Abierto", "Asignado", "En proceso", "Resuelto"].map((x) => `<option ${S.ticketFilter === x ? "selected" : ""}>${x}</option>`).join("")}</select><div class="section">Reportes</div><div id="ticketList">${S.tickets
            .map((t, i) => ({ t, i }))
            .filter(
              ({ t }) =>
                S.ticketFilter === "Todos" || t.status === S.ticketFilter,
            )
            .map(
              ({ t, i }) =>
                `<div class="card" onclick="S.ticketIndex=${i};go('ticketDetalle')"><div class="row"><b>${esc(t.id)}</b>${pill(t.status)}</div><div class="small">${esc(t.name)} · ${esc(t.type)}</div><div class="small muted">Prioridad ${esc(t.priority || "Media")} · ${esc(t.technician || "Sin asignar")}</div></div>`,
            )
            .join("")}</div>`,
        ticketDetalle: () => {
          let t = S.tickets[S.ticketIndex];
          return `<div class="card hero"><div class="eyebrow">TICKET ${esc(t.id)}</div><div class="metric" style="font-size:22px">${esc(t.type)}</div>${pill(t.status)}</div><div class="card"><div class="row"><span class="muted">Cliente</span><b>${esc(t.name)}</b></div><div class="divider"></div><div class="row"><span class="muted">Prioridad</span><b>${esc(t.priority || "Media")}</b></div><div class="divider"></div><div class="small muted">${esc(t.description || "Sin descripción adicional")}</div></div><form onsubmit="updateTicket(event)"><label class="field">Técnico disponible</label><select class="input" id="ticketTechnician"><option value="">Sin asignar</option>${S.users
            .filter((u) => u.type === "Técnico" && u.status === "Activo")
            .map(
              (u) =>
                `<option ${t.technician === u.name ? "selected" : ""}>${esc(u.name)}</option>`,
            )
            .join(
              "",
            )}</select><label class="field">Estado</label><select class="input" id="ticketStatus">${["Abierto", "Asignado", "En proceso", "Resuelto"].map((x) => `<option ${t.status === x ? "selected" : ""}>${x}</option>`).join("")}</select><div class="gap"></div><button class="btn full">Guardar cambios</button></form>`;
        },
      });
      function registerEquipment(e) {
        e.preventDefault();
        let cat = $("equipmentCategory").value,
          serial = $("equipmentSerial").value.trim();
        if (
          !serial ||
          S.equipment.some(
            (x) => x.serial.toLowerCase() === serial.toLowerCase(),
          )
        ) {
          toast("Ingresa un número de serie único");
          return;
        }
        S.equipment.push({
          category: cat,
          serial,
          status: "Disponible",
          assigned: "",
        });
        S.equipmentIndex = S.equipment.length - 1;
        go("equipoDetalle");
      }

[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: pruebas unitarias (sin BD)
    integration: pruebas de integración con PostgreSQL
    system: pruebas de sistema contra la API desplegada
    acceptance: pruebas de aceptación con Selenium
    security: pruebas de seguridad
    performance: pruebas de rendimiento
    caso(id, descripcion): caso del plan de pruebas
